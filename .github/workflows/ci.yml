name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHPUnit (fail on deprecations)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, xml, tokenizer, pdo, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        uses: ramsey/composer-install@v3

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (fail on PHPUnit deprecation warnings)
        run: vendor/bin/phpunit --fail-on-deprecation --fail-on-phpunit-deprecation